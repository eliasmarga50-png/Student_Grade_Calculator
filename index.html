
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>

        <div class="input-group">
            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >
        </div>

        <div class="input-group">
            <label for="mark1">Subject 1 Mark</label>
            <input
                type="number"
                id="mark1"
                placeholder="Enter first subject mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

        <div class="input-group">
            <label for="mark2">Subject 2 Mark</label>
            <input
                type="number"
                id="mark2"
                placeholder="Enter second subject mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

        <div class="input-group">
            <label for="mark3">Subject 3 Mark</label>
            <input
                type="number"
                id="mark3"
                placeholder="Enter third subject mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

        <div id="result" class="result"></div>

        <button id="calculateBtn">Calculate Grade</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
