
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

   
        <div class="input-group">
            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >
        </div>

      
        <div class="input-group">
            <label for="mark1">Mathematics</label>
            <input
                type="number"
                id="mark1"
                placeholder="Enter mathematics mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

    
        <div class="input-group">
            <label for="mark2">English</label>
            <input
                type="number"
                id="mark2"
                placeholder="Enter English mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

       
        <div class="input-group">
            <label for="mark3">Biology</label>
            <input
                type="number"
                id="mark3"
                placeholder="Enter Biology mark"
                min="0"
                max="100"
                step="any"
            >
        </div>

        
        <div id="result" class="result"></div>

        <button id="calculateBtn">Calculate Grade</button>

        <h2>Student Grade Records</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>WWeb Design</th>
                        <th>Security</th>
                        <th>tools</th>
                        <th>Average</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="studentRecords">

                </tbody>
            </table>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
